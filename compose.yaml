name: contracts-ext
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contracts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contracts_local}
      POSTGRES_DB: ${POSTGRES_DB:-contracts}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5540}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3055}:3000"
    command: ["gotenberg", "--api-timeout=60s", "--libreoffice-disable-routes=false"]
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-contracts}:${POSTGRES_PASSWORD:-contracts_local}@db:5432/${POSTGRES_DB:-contracts}
      GOTENBERG_URL: http://gotenberg:3000
      COMPRAS_API_BASE_URL: ${COMPRAS_API_BASE_URL:-https://dadosabertos.compras.gov.br}
    ports:
      - "127.0.0.1:${API_PORT:-4100}:4100"
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4100
      PORT: 3100
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
